<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}">
    <link rel="stylesheet" href="../themes/minimal/blog.css">
  </head>
  <body>
    <article>
      <h1>{{ title }}</h1>
      <p><time>{{ date }}</time></p>
      <p>{{ description }}</p>
      {{ content }}
      <p>{{ tags }}</p>
    </article>
  </body>
</html>
